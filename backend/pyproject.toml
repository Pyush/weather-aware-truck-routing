[project]
name = "tripplan-backend"
version = "0.1.0"
description = "Weather-aware truck routing: risk classification, route sampling and recommendation"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "ruff>=0.6",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "tripplan*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tripplan/tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: hits real third-party APIs (deselected by default)",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "ANN",  # annotations
    "D",    # pydocstyle
    "TID",  # tidy imports
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
# Django's settings-split idiom is star-import then override, which is
# intentional: F403/F405 (star import), F811 (redefinition is the override),
# and the missing-docstring rules that do not apply to config modules.
"config/settings/*.py" = ["F403", "F405", "F811"]
"config/*.py" = ["D104"]
# N818 wants every exception name to end in "Error". These read better as a
# taxonomy -- UpstreamTimeout / GeocodeNotFound / NoRouteFound -- and the module
# is already errors.py, so the suffix would be noise.
"tripplan/adapters/errors.py" = ["N818"]
# Same reasoning for the HTTP-facing taxonomy: ValidationFailed / NoRouteAvailable
# read better than *Error inside a module already named errors.py.
"tripplan/api/errors.py" = ["N818", "ANN401"]
# get_json returns whatever the provider returned; `Any` is the honest type and
# every caller parses it into a typed model immediately.
"tripplan/adapters/http.py" = ["ANN401"]
"tripplan/api/views.py" = ["ANN401"]
# Management-command packages are namespace packages.
"tripplan/management/__init__.py" = ["D104"]
"tripplan/management/commands/__init__.py" = ["D104"]
# Django management commands take argparse and **options; annotating them buys
# nothing, and argparse offers no useful type to write.
"tripplan/management/**/*.py" = ["ANN001", "ANN002", "ANN003", "RUF012"]
# Test doubles use loose typing on purpose, and a mutable class-level table is
# how a fixture reads best.
"*/tests/*" = ["D100", "D101", "D102", "D103", "D104", "D107", "ANN001", "ANN201", "ANN204", "ANN401", "D403", "RUF012", "B007"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["config", "tripplan"]
