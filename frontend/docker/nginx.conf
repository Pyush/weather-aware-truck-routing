server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the upstream per request instead of once at startup. nginx
    # resolves `proxy_pass` hostnames when it loads the config, so if the
    # backend is not up yet -- or is restarting -- nginx exits with
    # "host not found in upstream" and the container crash-loops. 127.0.0.11 is
    # Docker's embedded DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app is a single-page app: unknown paths are client routes (a shared
    # analysis link, for example) and must return index.html, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NOT be cached, or a deploy leaves clients loading a
    # document that references assets which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django reads this to decide the request was https; without it every
        # request looks like plain HTTP and the SSL redirect loops.
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Streaming ------------------------------------------------------
        # The NDJSON endpoint sends geometry in ~2.5s and then weather for up
        # to ~20s. Buffering either hides the progress the whole design exists
        # to show, and on a slow client the upstream read is held open.
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # A full analysis is ~21s upstream; the default 60s is generous enough
        # but explicit, so a change in latency budget is a deliberate edit.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}