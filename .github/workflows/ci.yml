# Every gate that can fail a pull request.
#
# The job order is cheapest-first: a typo in a test file should fail in seconds
# from `ruff`, not after a Docker build. `needs:` encodes that.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the previous run for the same ref. Without this, a
  # branch with six pushes queues six builds and the result read afterwards is
  # from whichever finished last, not the current code.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend · ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Lint
        run: |
          ruff check backend
          ruff format --check backend

      - name: Test
        working-directory: backend
        # `-m "not integration"` keeps the suite off the network: the live-API
        # tests are opt-in, so a third-party outage cannot fail our build.
        run: pytest -q -m "not integration"

      - name: System checks
        run: python manage.py check
        working-directory: backend

      - name: Security scan
        run: bash scripts/security-check.sh --full

      - name: Prove the security scanner still detects secrets
        # A scanner that silently stops matching is worse than none: it reports
        # "clean" forever. This plants a known-bad token and requires a hit.
        run: bash scripts/security-check.sh --self-test

  contract:
    name: Contract · backend/frontend drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e "backend[dev]"
      # The frontend is hand-written against a generated contract. If the
      # backend renames a field and nobody regenerates, the UI reads
      # `undefined` at runtime with no type error -- so this is the check that
      # makes that impossible.
      - name: Fail if contract.json is stale
        run: python backend/manage.py export_contract --check

  frontend:
    name: Frontend · lint + tsc + vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker · images build and the stack answers
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # Building is the point, not the unit tests inside the image. These were
      # the only checks that could catch B-54 (worker URL) and B-58 (nginx
      # upstream resolution), so they are worth the minutes.
      - name: Build
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: The proxied health endpoint answers
        run: curl --fail --silent --show-error http://127.0.0.1:5173/api/v1/health/

      - name: The stream is not buffered by the proxy
        # If nginx buffered, the first byte would arrive with the last. Both
        # numbers are asserted rather than eyeballed.
        run: |
          curl --silent --output /tmp/stream.ndjson \
            --write-out 'first_byte=%{time_starttransfer} total=%{time_total}\n' \
            --max-time 120 \
            -X POST http://127.0.0.1:5173/api/v1/trips/analyze/stream/ \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/x-ndjson' \
            -d '{"origin":"Chicago, IL","destination":"Detroit, MI","departure":"2026-10-18T14:00:00Z","load_lb":40000,"spacing_mi":25}'
          python - <<'PY'
          import json, pathlib
          events = [json.loads(line) for line in pathlib.Path("/tmp/stream.ndjson").read_text().splitlines() if line.strip()]
          kinds = [e["type"] for e in events]
          assert kinds[0] == "meta", kinds[:3]
          assert kinds[-1] == "done", kinds[-3:]
          assert kinds.count("route") == 3, kinds
          print("event order ok:", kinds)
          PY

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Tear down
        if: always()
        run: docker compose down -v