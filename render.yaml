# Two independent free services: a static Vite site and a Django API.
# No Redis/database is required; Django uses an in-process cache by default.
services:
  - type: web
    name: weather-aware-truck-routing-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health/
    # The 512 MB free instance needs a single worker. Keep the timeout long
    # enough for the sequential hourly-forecast fetch and an NDJSON connection.
    dockerCommand: >-
      gunicorn config.wsgi:application
      --bind 0.0.0.0:8000
      --workers 1 --threads 2
      --timeout 90 --graceful-timeout 30
      --worker-tmp-dir /app/run
      --access-logfile - --error-logfile -
    envVars:
      - key: PORT
        value: "8000"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # prod.py reads RENDER_EXTERNAL_HOSTNAME at runtime. A Blueprint
      # self-reference can be empty during initial provisioning.
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: weather-aware-truck-routing
          envVarKey: RENDER_EXTERNAL_URL
      - key: WEATHER_PROVIDER
        value: mock
      - key: CACHE_BACKEND
        value: locmem

  - type: web
    name: weather-aware-truck-routing
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: weather-aware-truck-routing-api
          envVarKey: RENDER_EXTERNAL_URL
